<header class="header">
  <a class="logo-group" routerLink="/items">
    <img src="logo.svg" alt="" width="48" height="48" />
    <span class="logo-title">&Ouml;RDER</span>
  </a>
  <nav>
    <a routerLink="/items" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Items</a>
    @if (auth.isAdmin()) {
      <a routerLink="/items/new" routerLinkActive="active">New item</a>
      <a routerLink="/customers" routerLinkActive="active">Customers</a>
    }
    @if (auth.user(); as user) {
      <button type="button" (click)="logout()" [title]="user.email">Log out</button>
    } @else {
      <a routerLink="/customers/new" routerLinkActive="active">Register</a>
      <a routerLink="/login" routerLinkActive="active">Log in</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer">
  <img src="logo.svg" alt="" width="48" height="48" />
  <span class="logo-title">&Ouml;RDER</span>
</footer>
<app-toasts />
