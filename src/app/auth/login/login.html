<section>
  <div class="section-header">
    <h1 class="section-title">Log in</h1>
  </div>

  <form class="form" [formGroup]="form" (ngSubmit)="login()" novalidate>
    <label class="form-label" for="email">Email</label>
    <input class="form-control" id="email" type="email" formControlName="email" autocomplete="username" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="error-text">Enter a valid email address.</p>
    }

    <label class="form-label" for="password">Password</label>
    <input class="form-control" id="password" type="password" formControlName="password"
           autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="error-text">Password is required.</p>
    }

    @if (error()) {
      <p class="error-text" role="alert">{{ error() }}</p>
    }

    <div class="button-row">
      <button class="btn btn-create" type="submit">LOG IN</button>
    </div>
  </form>
</section>
